name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: amd64, runner: windows-2022 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
          - { os: darwin, arch: arm64, runner: macos-14 }
        exclude:
          - { os: darwin, arch: amd64 }

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="${RELEASE_TAG#v}"
            echo "SETUPTOOLS_SCM_PRETEND_VERSION=$SETUPTOOLS_SCM_PRETEND_VERSION" >> "$GITHUB_ENV"
          fi
          python -m pip install --upgrade pip
          python -m pip install '.[installer]'

      - name: Determine package version
        id: version
        shell: bash
        run: |
          version=$(python -c 'from importlib.metadata import version; print(version("pyts"))')
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: python -m build

      - name: Build executable
        run: pyinstaller --clean --noconfirm --name pyTS src/pyts/__main__.py

      - name: Archive executable
        id: archive
        working-directory: dist/pyTS
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          archive_prefix="pyTS-${PACKAGE_VERSION}"
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            archive="${archive_prefix}-${{ matrix.os }}-${{ matrix.arch }}.zip"
            7z a "../$archive" .
          else
            archive="${archive_prefix}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
            tar -czf "../$archive" .
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          name: ${{ steps.archive.outputs.ARCHIVE }}
          path: dist/${{ steps.archive.outputs.ARCHIVE }}

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[lint]'

      - name: Run tests
        run: python -m pytest -q --cov=src/pyts --cov-report=xml:coverage.xml --cov-report=html:coverage-html

      - name: Upload HTML coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: coverage-html

      - name: Publish coverage report to QLTY
        if: matrix.python-version == '3.12'
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml
          add-prefix: src/pyts
          skip-errors: false

      - name: Run Pyright
        run: python -m pyright

      - name: Run mypy
        run: python -m mypy

  release:
    name: Attach executables to GitHub release
    if: github.event_name == 'release'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          pattern: pyTS-*
          skip-decompress: true
          merge-multiple: true

      - name: Validate release archive versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          shopt -s nullglob
          archives=(release-assets/*)
          if (( ${#archives[@]} == 0 )); then
            echo "::error::No release archives found."
            exit 1
          fi
          for archive in "${archives[@]}"; do
            filename="${archive##*/}"
            if [[ ! -f "$archive" || ! "$filename" =~ ^"pyTS-${expected_version}-"[^-]+-[^-]+\.(tar\.gz|zip)$ ]]; then
              echo "::error::Unexpected release archive '$filename'; expected version '$expected_version'."
              exit 1
            fi
          done

      - name: Upload executables to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG_NAME}" release-assets/*  --repo "${{ github.repository }}" --clobber
