name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        include:
          - { os: linux, arch: amd64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm }
          - { os: windows, arch: amd64, runner: windows-2022 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
          - { os: darwin, arch: arm64, runner: macos-14 }
        exclude:
          - { os: darwin, arch: amd64 }

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[installer]'

      - name: Build package
        run: python -m build

      - name: Build executable
        run: pyinstaller --clean --noconfirm --onefile --name pyTS src/pyts/__main__.py

      - name: Archive executable
        id: archive
        working-directory: dist
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            7z a pyTS-${{ matrix.os }}-${{ matrix.arch }}.zip pyTS.exe
            echo "ARCHIVE=pyTS-${{ matrix.os }}-${{ matrix.arch }}.zip" >> $GITHUB_OUTPUT
          else
            tar -czf pyTS-${{ matrix.os }}-${{ matrix.arch }}.tar.gz pyTS
            echo "ARCHIVE=pyTS-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          archive: false
          name: ${{ steps.archive.outputs.ARCHIVE }}
          path: dist/${{ steps.archive.outputs.ARCHIVE }}

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[lint]'

      - name: Run tests
        run: python -m pytest -q --cov=src/pyts --cov-report=xml:coverage.xml --cov-report=html:coverage-html

      - name: Upload HTML coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: coverage-html

      - name: Publish coverage report to QLTY
        if: matrix.python-version == '3.12'
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml
          strip-prefix: ${{ github.workspace }}/
          skip-errors: false

      - name: Run Pyright
        run: python -m pyright

      - name: Run mypy
        run: python -m mypy
